name: Test YAML Config Action
on:
  workflow_dispatch:
jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run programmable-banking-card-code-action (dry run)
        uses: ./
        with:
          payments-file: example-config.yml
          clientId: ${{ secrets.CLIENT_ID }}
          clientSecret: ${{ secrets.CLIENT_SECRET }}
          apiKey: ${{ secrets.API_KEY }}
          dry-run: true
